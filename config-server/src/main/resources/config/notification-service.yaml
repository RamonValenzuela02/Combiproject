server:
  port: 8089

spring:
  cloud:
    discovery:
      enable: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/mycompany-microservices-realm
#  data:
#    mongodb:
#      uri: mongodb://localhost:27017/notification-service
  kafka:
    bootstrap-servers: localhost:9062
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID}
    auth-token: ${TWILIO_AUTH_TOKEN}
    phone-number: ${TWILIO_PHONE_NUMBER}



eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

