server:
  port: 8081

spring:
  cloud:
    discovery:
      enable: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/mycompany-microservices-realm
resilience4j:
  retry:
    instances:
      ledgerRetry:
        max-attempts: 3
        wait-duration: 50ms
        retry-exceptions:
          - jakarta.persistence.OptimisticLockException
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
