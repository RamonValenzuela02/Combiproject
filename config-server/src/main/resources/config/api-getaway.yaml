server:
  port: 8060

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

spring:
  cloud:
    gateway:
      routes:
        - id: department-service
          uri: lb://booking-service
          predicates:
              - Path=/api/v1/trips/**
              - Path=/api/v1/users/**
              - Path=/api/v1/booking/**

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/mycompany-microservices-realm